services:
  - type: web
    name: nids-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SENSOR_TOKEN
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: NIDS Administrator
      - key: NIDS_TIMEZONE
        value: Africa/Lagos
      - key: CORS_ORIGINS
        value: https://nids-frontend-yaew.onrender.com

  - type: web
    name: nids-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nids-api-yaew.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
