services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nids
      POSTGRES_USER: nids
      POSTGRES_PASSWORD: change-this-db-password
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids -d nids"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nids:change-this-db-password@db:5432/nids
      JWT_SECRET: change-this-to-a-long-random-secret
      SENSOR_TOKEN: local-demo-sensor-token
      NIDS_TIMEZONE: Africa/Lagos
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:10000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment: {VITE_API_URL: http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
